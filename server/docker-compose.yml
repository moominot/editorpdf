services:
  afirma-relay:
    build: .
    container_name: afirma-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:8090"   # només accessible en local; Tailscale Funnel el publica amb HTTPS
    environment:
      # Origen de la web (GitHub Pages), p. ex. https://elmeuusuari.github.io. Deixa '*' mentre proves.
      ALLOWED_ORIGIN: "https://moominot.github.io"
      TTL_SECONDS: "600"
      MAX_BODY_MB: "120"
    read_only: true
    tmpfs:
      - /tmp:size=32m   # TSL i fitxers temporals de la validació de certificats
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
