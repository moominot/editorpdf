services:
  afirma-relay:
    build: .
    container_name: afirma-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:8099:8090"   # només accessible en local; Tailscale Funnel el publica amb HTTPS
    environment:
      # Origen de la web (GitHub Pages), p. ex. https://elmeuusuari.github.io. Deixa '*' mentre proves.
      # Es poden posar diversos orígens separats per comes (p. ex. el servidor local de proves).
      ALLOWED_ORIGIN: "https://moominot.github.io,http://localhost:8080"
      TTL_SECONDS: "600"
      MAX_BODY_MB: "120"
      TSL_CACHE: /var/lib/afirma/tsl.pem
    read_only: true
    tmpfs:
      - /tmp:size=32m   # fitxers temporals de la validació de certificats
    volumes:
      - tsl-cache:/var/lib/afirma   # última TSL bona: disponible de seguida després d'un reinici
    # DNS explícit: si el servidor arrenca abans que la xarxa (p. ex. després d'un tall de llum), el DNS intern de
    # Docker pot quedar sense servidors i el contenidor no resol noms fins que es recrea
    dns:
      - 192.168.178.1
      - 9.9.9.9
      - 1.1.1.1
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  tsl-cache:
